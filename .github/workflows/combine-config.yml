name: Combine JSON configuration files

on:
  push:
    branches:
      - 'main'

# RA-GH-N1 (2026-08-19) — declared explicitly so this workflow no longer depends on the
# org-wide default_workflow_permissions. It needs write because it commits the merged JSON and pushes.
# The org default is being lowered to `read`; without this block that flip breaks this run.
permissions:
  contents: write

# Each run commits config.json to main. Two runs at the same time race, and the later push
# is rejected (run 37707500517, 2026-10-08). Runs queue instead of overlapping. A newer push
# supersedes a pending run, so GitHub may cancel that pending run; the newer run covers it.
concurrency:
  group: combine-config
  cancel-in-progress: false

jobs:
  merge_json_files:
    # ubuntu-slim: 1 vCPU at a third of the price. Short, no Docker, well under its 15-minute cap.
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          # The tip of main, not the commit that started the run: the previous run may have
          # pushed a "Merge JSON files" commit since, and a push on top of an older commit fails.
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Or your preferred version

      - name: Install dependencies
        run: npm install

      - name: Merge JSON files
        run: |
          node merge-config.js

      - name: Commit and push changes
        run: |
          git config --global user.name "$GIT_USERNAME"
          git config --global user.email "$GIT_EMAIL"
          git add config.json
          git update-index --refresh
          git diff-index --quiet HEAD || (git commit -m "Merge JSON files" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_USERNAME: github-actions[bot]
          GIT_EMAIL: github-actions[bot]@users.noreply.github.com